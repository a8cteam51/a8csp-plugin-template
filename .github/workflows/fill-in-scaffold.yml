name: Fill in the Scaffold Placeholders

on:
  repository_dispatch:
    types: [ fill_scaffold ]
  workflow_dispatch:

# Serialize runs repo-wide; a cancelled half-pushed fill would leave the generated repo inconsistent.
concurrency:
  group: fill-scaffold-${{ github.repository_id }}
  cancel-in-progress: false

jobs:
  fill-scaffold:
    name: Fill in the placeholders
    if: github.repository != 'a8cteam51/a8csp-plugin-template'

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # A run queued against a non-default ref must never fill in and push scaffolding commits there.
      - name: Require the workflow ref to be the default branch.
        env:
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "::error::workflow ref '$REF_NAME' is not the repository default branch '$DEFAULT_BRANCH'; re-run this workflow from the default branch"
            exit 1
          fi

      # fill-in-scaffold.mjs derives every PHP global rename from php-globals-short-prefix and
      # every title/namespace rename from human-title. A missing property would bake broken
      # renames into commits that are already pushed; failing before anything runs keeps a
      # misconfigured repository pristine.
      - name: Require the php-globals-short-prefix and human-title custom properties.
        env:
          CUSTOM_PROPERTIES: ${{ toJSON( github.event.repository.custom_properties ) }}
        run: |
          for property in php-globals-short-prefix human-title; do
            value=$(printf '%s' "$CUSTOM_PROPERTIES" | jq -r --arg property "$property" '.[$property] // empty')
            if [ -z "$value" ]; then
              echo "::error::repository custom property '$property' is missing or empty; set it on the repository and re-run this workflow"
              exit 1
            fi
          done

      # Credentials are persisted on purpose: the final step pushes the
      # scaffolding commits back to the repo via the checkout-provided token.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        # zizmor: ignore[artipacked] git push below needs the persisted token

      - name: Check whether the scaffold was already filled.
        id: scaffold-check
        run: |
          if [ ! -f .github/workflows/fill-in-scaffold.mjs ] || [ ! -f README.scaffold.md ]; then
            echo "::notice::a prior fill-in-scaffold run already completed; this duplicate run is a no-op"
            echo "already-filled=true" >> "$GITHUB_OUTPUT"
          else
            echo "already-filled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup proper Node.js version
        if: steps.scaffold-check.outputs.already-filled != 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: 'package.json'

      - name: Set github actions[bot] as the committer.
        if: steps.scaffold-check.outputs.already-filled != 'true'
        run: git config --local user.name 'github-actions[bot]' && git config --local user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Rename the readme and plugin file.
        if: steps.scaffold-check.outputs.already-filled != 'true'
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          git mv --force README.scaffold.md README.md
          git mv a8csp-template-plugin.php "$REPO_NAME.php"

      - name: Commit the changed files.
        if: steps.scaffold-check.outputs.already-filled != 'true'
        run: git commit -am "chore -- rename files from scaffolding"

      - name: Clear the changelog fragments and the example POT.
        if: steps.scaffold-check.outputs.already-filled != 'true'
        run: |
          # Changelog fragments describe the scaffold's own development history, not the new plugin's, so they must not carry over into a freshly generated plugin.
          find changelog -type f ! -name '.gitkeep' -delete
          # The POT's msgids and source references describe the template's own strings; a generated repo regenerates it with its own slug via the composer i18n scripts.
          rm -f languages/*.pot

      - name: Commit the changed files.
        if: steps.scaffold-check.outputs.already-filled != 'true'
        run: git commit -am "chore -- clear scaffold changelog fragments and the example POT"

      - name: Perform string replacements within the files.
        if: steps.scaffold-check.outputs.already-filled != 'true'
        env:
          REPO_JSON: ${{ toJSON( github.event.repository ) }}
        run: node ./.github/workflows/fill-in-scaffold.mjs "$REPO_JSON"

      - name: Setup PHP for re-locking composer.json.
        if: steps.scaffold-check.outputs.already-filled != 'true'
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      # The name substitution invalidates composer.lock's content-hash, so the lock is refreshed before the commit includes it.
      - name: Re-lock composer.json after the name substitution.
        if: steps.scaffold-check.outputs.already-filled != 'true'
        run: composer update --lock --no-install

      - name: Commit the changed files.
        if: steps.scaffold-check.outputs.already-filled != 'true'
        run: git commit -am "chore -- fill in scaffolding placeholders"

      - name: Remove the spent fill-in-scaffold workflow.
        if: steps.scaffold-check.outputs.already-filled != 'true'
        run: |
          rm .github/workflows/fill-in-scaffold.yml .github/workflows/fill-in-scaffold.mjs
          git add .github/workflows
          git commit -m "chore -- remove the spent fill-in-scaffold workflow"

      - name: Push all the changed files.
        if: steps.scaffold-check.outputs.already-filled != 'true'
        run: git push
