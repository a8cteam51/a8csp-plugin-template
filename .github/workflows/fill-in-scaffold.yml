name: Fill in the Scaffold Placeholders

on:
  repository_dispatch:
    types: [ fill_scaffold ]
  workflow_dispatch:
    inputs:
      strip-teaching-content:
        description: 'Rewrite the template teaching prose into production docblocks'
        type: boolean
        required: false
        default: false

# Serialize runs repo-wide; a cancelled half-pushed fill would leave the generated repo inconsistent.
concurrency:
  group: fill-scaffold-${{ github.repository_id }}
  cancel-in-progress: false

jobs:
  fill-scaffold:
    name: Fill in the placeholders
    if: github.repository != 'a8cteam51/a8csp-plugin-template'

    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      # A run queued against a non-default ref must never fill in and push scaffolding commits there.
      - name: Require the workflow ref to be the default branch.
        env:
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "::error::workflow ref '$REF_NAME' is not the repository default branch '$DEFAULT_BRANCH'; re-run this workflow from the default branch"
            exit 1
          fi

      # Validate every input before checkout so an invalid repository remains pristine.
      # fill-in-scaffold.mjs derives every PHP global rename from php-globals-short-prefix and
      # every title/namespace rename from human-title, and the repository description and name land
      # in the plugin header and package identity. A malformed value bakes broken renames — up to
      # unparseable PHP, or valid-but-injected PHP the syntax sweep cannot catch — into commits that
      # are already pushed and trigger no CI.
      - name: Validate the scaffold identity inputs.
        env:
          REPO_JSON: ${{ toJSON( github.event.repository ) }}
        run: |
          read_json_value() {
            local destination="$1"
            local filter="$2"
            local value

            IFS= read -r -d '' value < <(
              printf '%s' "$REPO_JSON" | jq -r "$filter"
              printf '\0'
            )
            value=${value%$'\n'}
            printf -v "$destination" '%s' "$value"
          }

          report_error() {
            local field="$1"
            local value="$2"
            local requirement="$3"
            local displayed_value

            printf -v displayed_value '%q' "$value"
            printf '::error::%s has offending value %s; %s\n' "$field" "$displayed_value" "$requirement"
            invalid=1
          }

          read_json_value human_title '.custom_properties["human-title"] // empty'
          read_json_value php_globals_short_prefix '.custom_properties["php-globals-short-prefix"] // empty'
          read_json_value repository_description '.description // empty'
          read_json_value repository_name '.name'

          invalid=0

          # The title lands in PHP string literals and, space-stripped, in namespace declarations
          # and composer.json PSR-4 keys, so it must be alphanumerics and spaces.
          title_grammar='^[A-Za-z0-9][A-Za-z0-9 ]*$'
          if [ -z "$human_title" ]; then
            report_error "repository custom property 'human-title'" "$human_title" 'it must be present and non-empty'
          elif [[ ! "$human_title" =~ $title_grammar ]]; then
            report_error "repository custom property 'human-title'" "$human_title" 'it must contain only letters, digits, and spaces (it lands in PHP string literals and a namespace segment)'
          else
            # This template generates a real PHP namespace from the title (unlike the site template,
            # whose title-derived value reaches only @package tags), so the space-stripped form must
            # itself be a valid PHP identifier.
            namespace_segment=$(printf '%s' "$human_title" | sed 's/ //g; s/A8CSP//')
            if ! printf '%s' "$namespace_segment" | grep -Eq '^[A-Za-z_][A-Za-z0-9_]*$'; then
              report_error "repository custom property 'human-title'" "$human_title" "its space-stripped form '$namespace_segment' must be a valid PHP namespace segment (start with a letter)"
            fi
          fi

          # The prefix replaces `a8csp_template` in every minted global identifier; degenerate
          # values (`a`, `site_`) would ship collision-prone or double-underscore names fleet-wide.
          # The 15-character cap keeps prefixed registry keys (post types, options) inside
          # WordPress's length limits.
          prefix_grammar='^[a-z][a-z0-9_]{2,13}[a-z0-9]$'
          if [ -z "$php_globals_short_prefix" ]; then
            report_error "repository custom property 'php-globals-short-prefix'" "$php_globals_short_prefix" 'it must be present and non-empty'
          elif [[ ! "$php_globals_short_prefix" =~ $prefix_grammar ]] || [[ "$php_globals_short_prefix" == *__* ]]; then
            report_error "repository custom property 'php-globals-short-prefix'" "$php_globals_short_prefix" 'it must be 4-15 characters of lowercase snake_case, starting with a letter, ending with a letter or digit, with no __ runs'
          fi

          # The description lands verbatim in the plugin header docblock: a `*/` closes the comment
          # early (a crafted payload then reopens it and passes `php -l`), and a newline breaks the
          # single-line header.
          if [ -n "$repository_description" ]; then
            if [[ "$repository_description" == *$'\n'* || "$repository_description" == *$'\r'* ]]; then
              report_error 'repository description' "$repository_description" 'it must be a single line when set'
            fi
            if [[ "$repository_description" == *'*/'* ]]; then
              report_error 'repository description' "$repository_description" "it must not contain '*/'"
            fi
          fi

          # The repository name becomes the composer package slug and file identities.
          if [[ ! "$repository_name" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            report_error 'repository name' "$repository_name" 'it must match ^[a-z0-9]+(-[a-z0-9]+)*$'
          fi

          if [ "$invalid" -ne 0 ]; then
            exit 1
          fi

      # No credential persists on disk: the composer re-lock executes third-party code
      # (composer plugins), and the publish step passes the token explicitly.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Check whether the scaffold was already filled.
        id: scaffold-check
        run: |
          if [ ! -f .github/workflows/fill-in-scaffold.mjs ] || [ ! -f .github/workflows/fill-in-scaffold-content.mjs ] || [ ! -f README.scaffold.md ]; then
            echo "::notice::a prior fill-in-scaffold run already completed; this duplicate run is a no-op"
            echo "already-filled=true" >> "$GITHUB_OUTPUT"
          else
            echo "already-filled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup proper Node.js version
        if: steps.scaffold-check.outputs.already-filled != 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: 'package.json'

      - name: Set github actions[bot] as the committer.
        if: steps.scaffold-check.outputs.already-filled != 'true'
        run: git config --local user.name 'github-actions[bot]' && git config --local user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Rename the readme and plugin file.
        if: steps.scaffold-check.outputs.already-filled != 'true'
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          git mv --force README.scaffold.md README.md
          git mv a8csp-template-plugin.php "$REPO_NAME.php"

      - name: Commit the changed files.
        if: steps.scaffold-check.outputs.already-filled != 'true'
        run: git commit -am "chore -- rename files from scaffolding"

      - name: Clear the changelog fragments and the example POT.
        if: steps.scaffold-check.outputs.already-filled != 'true'
        run: |
          # Changelog fragments describe the scaffold's own development history, not the new plugin's, so they must not carry over into a freshly generated plugin.
          find changelog -type f ! -name '.gitkeep' -delete
          # The POT's msgids and source references describe the template's own strings; a generated repo regenerates it with its own slug via the composer i18n scripts.
          rm -f languages/*.pot

      - name: Commit the changed files.
        if: steps.scaffold-check.outputs.already-filled != 'true'
        run: git commit -am "chore -- clear scaffold changelog fragments and the example POT"

      - name: Setup PHP for the syntax sweep and composer re-lock.
        if: steps.scaffold-check.outputs.already-filled != 'true'
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Perform string replacements within the files.
        if: steps.scaffold-check.outputs.already-filled != 'true'
        env:
          REPO_JSON: ${{ toJSON( github.event.repository ) }}
        run: node ./.github/workflows/fill-in-scaffold.mjs "$REPO_JSON"

      # Optional second phase: strip the template's teaching prose, rewriting each passage into the
      # contract-level docblock a real plugin would carry, via the exact-match manifest in
      # fill-in-scaffold-content.mjs. It runs only when the dispatch asked for it — the
      # workflow_dispatch checkbox, or a `strip-teaching-content: true` key in the
      # repository_dispatch client payload. The manifest's `from` spans are written in
      # post-substitution form, so this MUST run after the identifier substitution above and before
      # the syntax sweep below; a docrot drift (any span no longer matching exactly once) fails the
      # build loudly rather than silently skipping.
      - name: Strip the template's teaching content.
        if: steps.scaffold-check.outputs.already-filled != 'true'
        env:
          STRIP_INPUT: ${{ inputs.strip-teaching-content }}
          STRIP_PAYLOAD: ${{ github.event.client_payload.strip-teaching-content }}
        run: |
          if [ "$STRIP_INPUT" = 'true' ] || [ "$STRIP_PAYLOAD" = 'true' ]; then
            node ./.github/workflows/fill-in-scaffold-content.mjs
          else
            echo "::notice::the dispatch did not ask for strip-teaching-content; keeping the template teaching prose"
          fi

      # --ignore-scripts keeps dependency lifecycle code from executing inside a job that will
      # push to the repository; the generated repository's own developers install normally. A full
      # re-resolve (not an in-place name substitution) is what correctly hoists git-dependency edges.
      - name: Regenerate package-lock.json after the name substitution.
        if: steps.scaffold-check.outputs.already-filled != 'true'
        run: rm -f package-lock.json && npm install --ignore-scripts

      # Substitution rewrote asset sources (slugs, text domains), so the committed build output is
      # rebuilt to match what this tree itself produces -- the build-integrity gate diffs exactly that.
      - name: Rebuild the committed assets from the substituted sources.
        if: steps.scaffold-check.outputs.already-filled != 'true'
        run: npm run build

      # The name substitution invalidates composer.lock's content-hash, so the lock is refreshed before the commit includes it.
      - name: Re-lock composer.json after the name substitution.
        if: steps.scaffold-check.outputs.already-filled != 'true'
        run: composer update --lock --no-install

      # Substituted identifiers land inside PHP source, and the rebuild above regenerates PHP build
      # assets — pushes from this workflow trigger no CI, so a parse error in either would ship a
      # dead-on-arrival repository. The sweep runs after the build so it covers the committed build
      # output too, and before anything is committed.
      - name: Syntax-check every generated PHP file.
        if: steps.scaffold-check.outputs.already-filled != 'true'
        run: |
          find . -name '*.php' -not -path './vendor/*' -not -path './node_modules/*' -print0 \
            | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Commit the changed files.
        if: steps.scaffold-check.outputs.already-filled != 'true'
        run: git commit -am "chore -- fill in scaffolding placeholders"

      # Deleting workflow files is the one .github/workflows change the push token permits
      # (it can never create or update them), which is why the template guard is a whole
      # separate workflow instead of steps inside quality.yml and release.yml.
      - name: Remove the spent fill-in-scaffold workflow and the template guard.
        if: steps.scaffold-check.outputs.already-filled != 'true'
        run: |
          rm .github/workflows/fill-in-scaffold.yml .github/workflows/fill-in-scaffold.mjs .github/workflows/fill-in-scaffold-content.mjs .github/workflows/template-guard.yml
          git add .github/workflows
          git commit -m "chore -- remove the spent fill-in-scaffold workflow and the template guard"

      - name: Publish all the changed commits.
        if: steps.scaffold-check.outputs.already-filled != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPOSITORY}.git" HEAD
