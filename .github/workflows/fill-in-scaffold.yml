name: Fill in the Scaffold Placeholders

on:
  repository_dispatch:
    types: [ fill_scaffold ]
  workflow_dispatch:
    inputs:
      strip-teaching-content:
        description: 'Rewrite the template teaching prose into production docblocks'
        type: boolean
        required: false
        default: false

# Serialize runs repo-wide; a cancelled half-pushed fill would leave the generated repo inconsistent.
concurrency:
  group: fill-scaffold-${{ github.repository_id }}
  cancel-in-progress: false

jobs:
  fill-scaffold:
    name: Fill in the placeholders
    if: github.repository != 'a8cteam51/a8csp-plugin-template'

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # A run queued against a non-default ref must never fill in and push scaffolding commits there.
      - name: Require the workflow ref to be the default branch.
        env:
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "::error::workflow ref '$REF_NAME' is not the repository default branch '$DEFAULT_BRANCH'; re-run this workflow from the default branch"
            exit 1
          fi

      # fill-in-scaffold.mjs derives every PHP global rename from php-globals-short-prefix and
      # every title/namespace rename from human-title. A missing or malformed property would bake
      # broken renames — up to unparseable PHP — into commits that are already pushed; failing
      # before anything runs keeps a misconfigured repository pristine.
      - name: Require valid php-globals-short-prefix and human-title custom properties.
        env:
          CUSTOM_PROPERTIES: ${{ toJSON( github.event.repository.custom_properties ) }}
        run: |
          for property in php-globals-short-prefix human-title; do
            value=$(printf '%s' "$CUSTOM_PROPERTIES" | jq -r --arg property "$property" '.[$property] // empty')
            if [ -z "$value" ]; then
              echo "::error::repository custom property '$property' is missing or empty; set it on the repository and re-run this workflow"
              exit 1
            fi
          done

          # The prefix lands in function, variable, and constant identifiers: degenerate or
          # unbounded values (`a`, `site_`, `my__thing`) ship collision-prone or double-underscore
          # names fleet-wide, and the 15-character cap keeps prefixed registry keys (post types,
          # options) inside WordPress's length limits.
          prefix=$(printf '%s' "$CUSTOM_PROPERTIES" | jq -r '.["php-globals-short-prefix"]')
          if ! printf '%s' "$prefix" | grep -Eq '^[a-z][a-z0-9_]{2,13}[a-z0-9]$' || printf '%s' "$prefix" | grep -q '__'; then
            echo "::error::php-globals-short-prefix '$prefix' must be 4-15 characters of lowercase snake_case, starting with a letter, ending with a letter or digit, with no __ runs (it becomes PHP identifiers)"
            exit 1
          fi

          # The title lands in PHP string literals and, space-stripped, in namespace declarations
          # and composer.json PSR-4 keys — so it must be alphanumerics and spaces, and its derived
          # namespace segment must itself be a valid PHP identifier.
          title=$(printf '%s' "$CUSTOM_PROPERTIES" | jq -r '.["human-title"]')
          if ! printf '%s' "$title" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9 ]*$'; then
            echo "::error::human-title '$title' must contain only letters, digits, and spaces (it becomes PHP strings and a namespace segment)"
            exit 1
          fi
          namespace_segment=$(printf '%s' "$title" | sed 's/ //g; s/A8CSP//')
          if ! printf '%s' "$namespace_segment" | grep -Eq '^[A-Za-z_][A-Za-z0-9_]*$'; then
            echo "::error::human-title '$title' derives the invalid namespace segment '$namespace_segment'; adjust the title so its space-stripped form starts with a letter"
            exit 1
          fi

      # No credential persists on disk: the composer re-lock executes third-party code
      # (composer plugins), and the publish step passes the token explicitly.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Check whether the scaffold was already filled.
        id: scaffold-check
        run: |
          if [ ! -f .github/workflows/fill-in-scaffold.mjs ] || [ ! -f README.scaffold.md ]; then
            echo "::notice::a prior fill-in-scaffold run already completed; this duplicate run is a no-op"
            echo "already-filled=true" >> "$GITHUB_OUTPUT"
          else
            echo "already-filled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup proper Node.js version
        if: steps.scaffold-check.outputs.already-filled != 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: 'package.json'

      - name: Set github actions[bot] as the committer.
        if: steps.scaffold-check.outputs.already-filled != 'true'
        run: git config --local user.name 'github-actions[bot]' && git config --local user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Rename the readme and plugin file.
        if: steps.scaffold-check.outputs.already-filled != 'true'
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          git mv --force README.scaffold.md README.md
          git mv a8csp-template-plugin.php "$REPO_NAME.php"

      - name: Commit the changed files.
        if: steps.scaffold-check.outputs.already-filled != 'true'
        run: git commit -am "chore -- rename files from scaffolding"

      - name: Clear the changelog fragments and the example POT.
        if: steps.scaffold-check.outputs.already-filled != 'true'
        run: |
          # Changelog fragments describe the scaffold's own development history, not the new plugin's, so they must not carry over into a freshly generated plugin.
          find changelog -type f ! -name '.gitkeep' -delete
          # The POT's msgids and source references describe the template's own strings; a generated repo regenerates it with its own slug via the composer i18n scripts.
          rm -f languages/*.pot

      - name: Commit the changed files.
        if: steps.scaffold-check.outputs.already-filled != 'true'
        run: git commit -am "chore -- clear scaffold changelog fragments and the example POT"

      - name: Setup PHP for the syntax sweep and composer re-lock.
        if: steps.scaffold-check.outputs.already-filled != 'true'
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Perform string replacements within the files.
        if: steps.scaffold-check.outputs.already-filled != 'true'
        env:
          REPO_JSON: ${{ toJSON( github.event.repository ) }}
        run: node ./.github/workflows/fill-in-scaffold.mjs "$REPO_JSON"

      # Optional second phase: strip the template's teaching prose, rewriting each passage into the
      # contract-level docblock a real plugin would carry, via the exact-match manifest in
      # fill-in-scaffold-content.mjs. It runs only when the dispatch asked for it — the
      # workflow_dispatch checkbox, or a `strip-teaching-content: true` key in the
      # repository_dispatch client payload. The manifest's `from` spans are written in
      # post-substitution form, so this MUST run after the identifier substitution above and before
      # the syntax sweep below; a docrot drift (any span no longer matching exactly once) fails the
      # build loudly rather than silently skipping.
      - name: Strip the template's teaching content.
        if: steps.scaffold-check.outputs.already-filled != 'true'
        env:
          STRIP_INPUT: ${{ inputs.strip-teaching-content }}
          STRIP_PAYLOAD: ${{ github.event.client_payload.strip-teaching-content }}
        run: |
          if [ "$STRIP_INPUT" = 'true' ] || [ "$STRIP_PAYLOAD" = 'true' ]; then
            node ./.github/workflows/fill-in-scaffold-content.mjs
          else
            echo "::notice::the dispatch did not ask for strip-teaching-content; keeping the template teaching prose"
          fi

      # Substituted identifiers land inside PHP source, and pushes from this workflow trigger no
      # CI — a parse error here would ship a dead-on-arrival repository, so every PHP file is
      # syntax-checked before anything is committed.
      - name: Syntax-check every generated PHP file.
        if: steps.scaffold-check.outputs.already-filled != 'true'
        run: |
          find . -name '*.php' -not -path './vendor/*' -not -path './node_modules/*' -print0 \
            | xargs -0 -n1 -P4 php -l > /dev/null

      # The name substitution invalidates composer.lock's content-hash, so the lock is refreshed before the commit includes it.
      - name: Re-lock composer.json after the name substitution.
        if: steps.scaffold-check.outputs.already-filled != 'true'
        run: composer update --lock --no-install

      - name: Commit the changed files.
        if: steps.scaffold-check.outputs.already-filled != 'true'
        run: git commit -am "chore -- fill in scaffolding placeholders"

      # Deleting workflow files is the one .github/workflows change the push token permits
      # (it can never create or update them), which is why the template guard is a whole
      # separate workflow instead of steps inside quality.yml and release.yml.
      - name: Remove the spent fill-in-scaffold workflow and the template guard.
        if: steps.scaffold-check.outputs.already-filled != 'true'
        run: |
          rm .github/workflows/fill-in-scaffold.yml .github/workflows/fill-in-scaffold.mjs .github/workflows/fill-in-scaffold-content.mjs .github/workflows/template-guard.yml
          git add .github/workflows
          git commit -m "chore -- remove the spent fill-in-scaffold workflow and the template guard"

      - name: Push all the changed files.
        if: steps.scaffold-check.outputs.already-filled != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPOSITORY}.git" HEAD
