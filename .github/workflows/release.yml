name: Release
# The repository this file ships from — the trunk-only template, pinned by its immutable ID — never releases itself; generated plugins have their own IDs, so the condition is permanently true for them. It rides along because generation can delete workflow files but never edit them.

on:
  push:
    tags: ['v*']
  # Exercises the release path without publishing, which is the only way to test it before a tag exists.
  workflow_dispatch:
    inputs:
      publish:
        description: 'Create the GitHub release'
        type: boolean
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  release:
    name: Release
    if: github.repository_id != '1297277915'
    permissions:
      actions: read
      contents: write
    uses: a8cteam51/a8csp-configs/.github/workflows/reusable-release.yml@trunk
    with:
      plugin-slug: ${{ github.event.repository.name }}
      # Matches the plugin header's Requires PHP; below it WordPress refuses to activate the artifact.
      php-version: '8.5'
      # The WooCommerce host: without it the plugin activates gated-off, which would pass trivially; with it the boot pipeline actually runs during the smoke request.
      extra-plugins: '["https://downloads.wordpress.org/plugin/woocommerce.zip"]'
      publish: ${{ github.event_name == 'push' || inputs.publish }}
