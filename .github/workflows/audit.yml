name: Audit

# Audits run when a lockfile changes. Advisories disclosed later are Dependabot alerts' job, and
# those cost no Actions minutes.
on:
  pull_request:
    paths: ['composer.lock', 'package-lock.json', '.github/workflows/audit.yml']
  push:
    branches: [trunk]
    paths: ['composer.lock', 'package-lock.json', '.github/workflows/audit.yml']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  supply-chain:
    name: Supply-chain audit
    uses: a8cteam51/a8csp-configs/.github/workflows/reusable-supply-chain-audit.yml@295fdb54961eb5a95ec9ed52f183cb44a16e004b # v1.1.0
