name: Workflow Checks

on:
  push:
    branches: [trunk]
    paths: ['.github/workflows/**', '.github/dependabot.yml']
  pull_request:
    # ready_for_review runs the check when a draft is marked ready.
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ['.github/workflows/**', '.github/dependabot.yml']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  workflow-checks:
    name: Workflow Checks
    # A draft pull request runs Quality only.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    # A caller must grant every permission the called jobs declare, or the call fails at startup.
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: a8cteam51/a8csp-configs/.github/workflows/reusable-workflow-checks.yml@231be2507946169eeb18080c04a597be4e3fac7c # v1.2.0
