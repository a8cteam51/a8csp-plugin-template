name: Workflow Checks

on:
  push:
    branches: [trunk]
    paths: ['.github/workflows/**', '.github/zizmor.yml', '.github/dependabot.yml']
  pull_request:
    paths: ['.github/workflows/**', '.github/zizmor.yml', '.github/dependabot.yml']
  schedule:
    # Keeps zizmor's online audits (e.g. known-vulnerable-actions) fresh between workflow changes.
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  workflow-checks:
    name: Workflow Checks
    # A caller must grant every permission the called jobs declare, or the call fails at startup.
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: a8cteam51/a8csp-configs/.github/workflows/reusable-workflow-checks.yml@trunk
