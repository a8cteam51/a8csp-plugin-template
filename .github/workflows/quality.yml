name: Quality

on:
  pull_request:
  push:
    branches: [trunk]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP Lint
    uses: a8cteam51/a8csp-configs/.github/workflows/reusable-php-lint.yml@trunk
    with:
      scripts: '["lint:php:phpcs", "lint:php:phpcs:tests", "lint:php:phpstan"]'

  lint-scripts-styles:
    name: JS + CSS Lint
    uses: a8cteam51/a8csp-configs/.github/workflows/reusable-scripts-styles-lint.yml@trunk

  block-json:
    name: block.json schema
    uses: a8cteam51/a8csp-configs/.github/workflows/reusable-block-json-check.yml@trunk

  php-syntax:
    name: PHP Syntax
    uses: a8cteam51/a8csp-configs/.github/workflows/reusable-php-syntax-check.yml@trunk
    with:
      php-versions: '["8.5", "8.6"]'

  belowfloor-syntax:
    name: Below-floor syntax (PHP ${{ matrix.php }})
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4']
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none

      # The entry file, functions-bootstrap.php, and uninstall.php must parse below the plugin's
      # PHP floor; functions.php and index.php load after the requirements gate and are excluded.
      # Discover the entry by its WordPress "Plugin Name:" header because
      # generation renames the file per repo without rewriting .github/.
      # functions-bootstrap.php and uninstall.php share the below-floor constraint but keep static
      # names across generation. Header discovery excludes them because neither has the plugin header,
      # so the matrix lints both explicitly by name.
      - name: Check the below-floor files for syntax errors
        run: |
          set -euo pipefail

          mapfile -t entry_files < <(grep -l 'Plugin Name:' "$GITHUB_WORKSPACE"/*.php || true)
          entry_count=${#entry_files[@]}
          if [ "$entry_count" -ne 1 ]; then
            echo "::error::expected exactly one root *.php file with a 'Plugin Name:' header, found $entry_count" >&2
            exit 1
          fi
          php -l "${entry_files[0]}"
          php -l "$GITHUB_WORKSPACE/functions-bootstrap.php"
          php -l "$GITHUB_WORKSPACE/uninstall.php"

  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - run: composer changelog:validate

  build-integrity:
    name: Build integrity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Verify the committed build output is byte-stable
        run: |
          set -euo pipefail

          build_status=$(git status --porcelain)
          if [ -n "$build_status" ]; then
            printf '%s\n' "$build_status"
            echo "::error::the committed build output must match a fresh build from source; rebuild and commit the result." >&2
            exit 1
          fi
