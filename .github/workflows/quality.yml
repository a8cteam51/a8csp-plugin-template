name: Quality

on:
  pull_request:
  push:
    branches: [trunk]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP Lint
    uses: a8cteam51/a8csp-configs/.github/workflows/reusable-php-lint.yml@trunk
    with:
      scripts: '["lint:php:phpcs", "lint:php:phpcs:tests", "lint:php:phpstan"]'

  lint-scripts-styles:
    name: JS + CSS Lint
    uses: a8cteam51/a8csp-configs/.github/workflows/reusable-scripts-styles-lint.yml@trunk

  block-json:
    name: block.json schema
    uses: a8cteam51/a8csp-configs/.github/workflows/reusable-block-json-check.yml@trunk

  php-syntax:
    name: PHP Syntax
    uses: a8cteam51/a8csp-configs/.github/workflows/reusable-php-syntax-check.yml@trunk
    with:
      php-versions: '["8.5", "8.6"]'

  bootstrap-syntax:
    name: Bootstrap syntax (PHP ${{ matrix.php }})
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none

      # Only the entry file and functions-bootstrap.php must parse below the plugin's PHP
      # floor; functions.php, uninstall.php, and index.php load after the requirements gate
      # and are excluded. Discover the entry by its WordPress "Plugin Name:" header because
      # generation renames the file per repo without rewriting .github/.
      # functions-bootstrap.php shares the below-floor constraint but keeps its static name
      # across generation, so it is linted explicitly by name because its missing plugin header
      # otherwise lets it silently escape this matrix.
      - name: Check the below-floor files for syntax errors
        run: |
          set -euo pipefail

          mapfile -t entry_files < <(grep -l 'Plugin Name:' "$GITHUB_WORKSPACE"/*.php || true)
          entry_count=${#entry_files[@]}
          if [ "$entry_count" -ne 1 ]; then
            echo "::error::expected exactly one root *.php file with a 'Plugin Name:' header, found $entry_count" >&2
            exit 1
          fi
          php -l "${entry_files[0]}"
          php -l "$GITHUB_WORKSPACE/functions-bootstrap.php"

  # Validation is deliberately not a fragment-per-PR gate: it keeps fragment validation
  # wired for generated plugins while never demanding a fragment of a template PR.
  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - run: composer changelog:validate

      # The template repository is trunk-only: it never versions itself, so on the template
      # (and only there — generated plugins have different repository IDs and version by
      # default) the fragment set, the header-only changelog, and the 1.0.0 spawn seed are
      # pinned. The repository_id comparison survives renames and transfers.
      - name: Enforce the trunk-only template state
        if: github.repository_id == '1297277915'
        run: |
          set -euo pipefail

          expected_fragments=$'changelog/.gitkeep\nchangelog/initial-template-population'
          actual_fragments=$(git ls-files changelog)
          if [ "$actual_fragments" != "$expected_fragments" ]; then
            echo "::error::the template is trunk-only: its history lives in git, so template PRs never add changelog fragments (the changelog machinery is scaffold payload for generated plugins)"
            exit 1
          fi

          if ! grep -Fxq '# Changelog' CHANGELOG.md || grep -Eq '^## ' CHANGELOG.md; then
            echo "::error::the template is trunk-only: it never releases, so CHANGELOG.md stays exactly its fragment-instructions header"
            exit 1
          fi

          if ! grep -Eq '^ \* Version:[[:space:]]+1\.0\.0$' a8csp-template-plugin.php ||
             ! grep -Fq '"version": "1.0.0"' package.json ||
             ! grep -Fq '**Stable tag:** 1.0.0' README.scaffold.md; then
            echo "::error::the template never versions itself: 1.0.0 is the spawn seed of every generated plugin, not a number to bump"
            exit 1
          fi
