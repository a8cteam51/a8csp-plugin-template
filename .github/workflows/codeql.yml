name: CodeQL

on:
  pull_request:
  push:
    branches: [trunk]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  codeql:
    name: CodeQL
    # Private repositories on this organization's plan have no GitHub Advanced Security, and the
    # reusable workflow skips its analysis there; skipping here starts no billed jobs.
    if: github.event.repository.private == false
    # A caller must grant every permission the called jobs declare, or the call fails at startup.
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: a8cteam51/a8csp-configs/.github/workflows/reusable-codeql.yml@231be2507946169eeb18080c04a597be4e3fac7c # v1.2.0
    with:
      languages: '["actions", "javascript-typescript"]'
